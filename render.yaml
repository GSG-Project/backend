services:
  - type: web
    name: llm-arena-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py seed_models && python manage.py seed_criteria && gunicorn config.wsgi:application --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OVH_AI_ENDPOINTS_API_KEY
        sync: false
      - key: JUDGE_MODEL
        value: openai/gpt-oss-120b
